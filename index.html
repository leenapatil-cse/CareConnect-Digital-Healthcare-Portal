<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CareConnect | Digital Healthcare Portal</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f7fb;color:#243248}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:10px 14px;background:#2478c9;color:white;font-weight:600}button:hover{filter:brightness(.95)}button.secondary{background:#e8f1fb;color:#2465a2}button.danger{background:#c94d55}.hidden{display:none!important}.app{min-height:100vh}.top{display:flex;align-items:center;justify-content:space-between;background:white;padding:16px 5%;box-shadow:0 2px 10px #dbe5ef;position:sticky;top:0;z-index:2}.brand{font-weight:800;font-size:21px;color:#2374bb}.brand span{color:#2a9a8a}.top-right{display:flex;align-items:center;gap:12px}.layout{display:flex;min-height:calc(100vh - 64px)}.sidebar{width:220px;padding:20px;background:#eaf3fb}.sidebar button{width:100%;margin:5px 0;text-align:left;background:transparent;color:#31516e}.sidebar button.active,.sidebar button:hover{background:white;color:#2075bb}.main{flex:1;padding:25px;max-width:1200px;margin:auto;width:100%}.welcome{background:linear-gradient(120deg,#2279c8,#43a99b);color:white;border-radius:16px;padding:22px;margin-bottom:20px}.welcome h2{margin:0 0 8px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:15px}.card{background:white;border-radius:13px;padding:18px;box-shadow:0 3px 12px #e2eaf1;margin-bottom:15px}.stat{font-size:27px;font-weight:bold;color:#287bc1;margin:7px 0}.card h3{margin-top:0}.muted{color:#6b7d90;font-size:14px}.row{display:flex;gap:12px;flex-wrap:wrap}.field{margin:10px 0;flex:1;min-width:180px}.field label{display:block;font-size:14px;font-weight:bold;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;padding:10px;border:1px solid #cbd8e5;border-radius:8px;background:white}.field textarea{min-height:80px;resize:vertical}.form{max-width:720px}.item{border:1px solid #e2eaf2;border-radius:10px;padding:13px;margin:9px 0}.badge{display:inline-block;background:#e7f4ef;color:#207b65;padding:5px 9px;border-radius:20px;font-size:12px;font-weight:bold}.badge.pending{background:#fff3d9;color:#9a6a13}.badge.cancelled{background:#fde9e9;color:#a43d43}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.notice{background:#fff6dc;border:1px solid #f0d78b;padding:12px;border-radius:9px;color:#735819;font-size:13px}.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#e7f3ff,#e7f8f4)}.login{width:100%;max-width:430px;background:white;border-radius:16px;padding:25px;box-shadow:0 8px 28px #cbdbe9}.login h1{color:#2374bb}.small{font-size:12px;color:#718397}.report-file{max-width:100%}hr{border:0;border-top:1px solid #edf1f5;margin:15px 0}table{border-collapse:collapse;width:100%;background:white}th,td{padding:10px;border-bottom:1px solid #e6edf4;text-align:left;font-size:14px}footer{padding:15px;color:#7a8998;text-align:center;font-size:12px}@media(max-width:700px){.layout{display:block}.sidebar{width:100%;display:flex;overflow:auto;padding:8px}.sidebar button{white-space:nowrap;width:auto}.main{padding:15px}.top{padding:13px}.brand{font-size:18px}}
</style>
</head>
<body>
<div id="loginScreen" class="login-wrap">
  <div class="login">
    <div class="brand">Care<span>Connect</span> 🩺</div>
    <h2>Digital Healthcare Portal</h2><p class="muted">Sign in to your demo account</p>
    <div class="field"><label>Demo role</label><select id="loginRole"><option value="patient">Patient</option><option value="doctor">Doctor</option></select></div>
    <div class="field"><label>Email</label><input id="loginEmail" value="patient@demo.com"></div>
    <div class="field"><label>Password</label><input id="loginPassword" type="password" value="patient123"></div>
    <button style="width:100%;margin-top:8px" onclick="login()">Login</button>
    <hr><div class="notice"><b>Demo accounts</b><br>Patient: patient@demo.com / patient123<br>Doctor: doctor@demo.com / doctor123<br>Choose the matching role above.</div>
  </div>
</div>
<div id="app" class="app hidden">
<header class="top"><div class="brand">Care<span>Connect</span> 🩺</div><div class="top-right"><span id="userLabel"></span><button class="secondary" onclick="logout()">Logout</button></div></header>
<div class="layout"><nav class="sidebar" id="nav"></nav><main class="main" id="main"></main></div>
<footer>CareConnect student demo • Fictional data only • Not for real medical use</footer>
</div>
<script>
const USERS={patient:{email:'patient@demo.com',password:'patient123',name:'Aarav Sharma',role:'patient'},doctor:{email:'doctor@demo.com',password:'doctor123',name:'Dr. Meera Rao',role:'doctor'}};
const read=(key,fallback)=>{try{return JSON.parse(localStorage.getItem(key))??fallback}catch{return fallback}};function save(key,value){localStorage.setItem(key,JSON.stringify(value))}
function seed(){if(!localStorage.getItem('cc_seeded')){save('cc_appointments',[{id:'APT1001',patient:'Aarav Sharma',doctor:'Dr. Meera Rao',date:'2026-12-02',time:'10:30',reason:'General check-up',status:'Requested',response:'Please bring previous reports if available.'}]);save('cc_messages',[{id:1,patient:'Aarav Sharma',doctor:'Dr. Meera Rao',from:'doctor',text:'Welcome. Please share your concern here and I will review it during your appointment.',time:new Date().toLocaleString()}]);save('cc_reports',[]);save('cc_profile',{name:'Aarav Sharma',age:'21',phone:'9000000000',blood:'O+',allergies:'None known'});localStorage.setItem('cc_seeded','1')}}seed();
let current=null,tab='dashboard';
function login(){const role=document.getElementById('loginRole').value,email=document.getElementById('loginEmail').value.trim(),pw=document.getElementById('loginPassword').value;const u=USERS[role];if(email!==u.email||pw!==u.password){alert('Invalid demo credentials. Check the demo account details.');return}current=u;tab='dashboard';document.getElementById('loginScreen').classList.add('hidden');document.getElementById('app').classList.remove('hidden');render()}
function logout(){current=null;document.getElementById('app').classList.add('hidden');document.getElementById('loginScreen').classList.remove('hidden')}
function setTab(t){tab=t;render()}
function navItems(){return current.role==='patient'?['dashboard','profile','appointments','reports','messages']:['dashboard','appointments','reports','messages']}
function render(){document.getElementById('userLabel').textContent=current.name+' • '+current.role;document.getElementById('nav').innerHTML=navItems().map(t=>`<button class="${tab===t?'active':''}" onclick="setTab('${t}')">${({dashboard:'Dashboard',profile:'My Profile',appointments:'Appointments',reports:'Medical Reports',messages:'Messages'})[t]}</button>`).join('');let content=({dashboard:dashboard,profile:profilePage,appointments:appointmentsPage,reports:reportsPage,messages:messagesPage})[tab]();document.getElementById('main').innerHTML=content}
function dashboard(){let ap=read('cc_appointments',[]),rp=read('cc_reports',[]);if(current.role==='patient'){let mine=ap.filter(a=>a.patient===current.name);return `<div class="welcome"><h2>Welcome back, ${current.name.split(' ')[0]} 👋</h2><p>Manage your appointments, reports and conversations in one place.</p></div><div class="grid"><div class="card"><div class="muted">My appointments</div><div class="stat">${mine.length}</div></div><div class="card"><div class="muted">My reports</div><div class="stat">${rp.filter(r=>r.patient===current.name).length}</div></div><div class="card"><div class="muted">Portal</div><div class="stat">Active</div><small>Demo account</small></div></div><div class="card"><h3>Quick actions</h3><button onclick="setTab('appointments')">Request appointment</button> <button class="secondary" onclick="setTab('reports')">Upload report</button></div><div class="notice">Demo portal only. This is not a real medical service and does not provide diagnosis.</div>`}return `<div class="welcome"><h2>Doctor Dashboard 👋</h2><p>Review appointment requests, reports and patient messages.</p></div><div class="grid"><div class="card"><div class="muted">Appointments</div><div class="stat">${ap.length}</div></div><div class="card"><div class="muted">Reports uploaded</div><div class="stat">${rp.length}</div></div><div class="card"><div class="muted">Patients</div><div class="stat">${new Set(ap.map(a=>a.patient)).size}</div></div></div><div class="card"><h3>Quick actions</h3><button onclick="setTab('appointments')">Review appointments</button> <button class="secondary" onclick="setTab('reports')">View reports</button></div><div class="notice">All patient details and records shown are fictional sample data.</div>`}
function profilePage(){let p=read('cc_profile',{});return `<div class="card"><h2>My Patient Profile</h2><p class="muted">Edit demo patient details below.</p><form class="form" onsubmit="saveProfile(event)"><div class="row"><div class="field"><label>Full name</label><input id="pname" value="${esc(p.name)}" required></div><div class="field"><label>Age</label><input id="page" type="number" min="1" max="120" value="${esc(p.age)}" required></div></div><div class="row"><div class="field"><label>Phone</label><input id="pphone" value="${esc(p.phone)}" pattern="[0-9]{10}" required></div><div class="field"><label>Blood group</label><select id="pblood"><option ${p.blood==='O+'?'selected':''}>O+</option><option>A+</option><option>B+</option><option>AB+</option><option>O-</option><option>A-</option><option>B-</option><option>AB-</option></select></div></div><div class="field"><label>Allergies / notes</label><textarea id="pallergy">${esc(p.allergies)}</textarea></div><button>Save profile</button></form></div>`}
function saveProfile(e){e.preventDefault();save('cc_profile',{name:document.getElementById('pname').value.trim(),age:document.getElementById('page').value,phone:document.getElementById('pphone').value,blood:document.getElementById('pblood').value,allergies:document.getElementById('pallergy').value});alert('Profile saved. Demo login name remains unchanged for this session.');render()}
function appointmentsPage(){let ap=read('cc_appointments',[]),visible=current.role==='patient'?ap.filter(a=>a.patient===current.name):ap;let form=current.role==='patient'?`<div class="card"><h3>Request an appointment</h3><form onsubmit="book(event)"><div class="row"><div class="field"><label>Date</label><input id="adate" type="date" min="${new Date().toISOString().slice(0,10)}" required></div><div class="field"><label>Preferred time</label><input id="atime" type="time" required></div></div><div class="field"><label>Reason for appointment</label><textarea id="areason" required maxlength="300" placeholder="Briefly describe your concern"></textarea></div><button>Submit request</button></form></div>`:'';return form+`<div class="card"><h2>${current.role==='patient'?'My Appointments':'Patient Appointments'}</h2>${visible.length?visible.map(a=>appointmentCard(a)).join(''):'<p class="muted">No appointments yet.</p>'}</div>`}
function appointmentCard(a){let doctorActions=current.role==='doctor'?`<div class="actions"><button class="secondary" onclick="status('${a.id}','Confirmed')">Confirm</button><button class="secondary" onclick="status('${a.id}','Completed')">Mark completed</button><button class="danger" onclick="status('${a.id}','Cancelled')">Cancel</button></div>`:'';return `<div class="item"><b>${a.id}</b> <span class="badge ${a.status==='Requested'?'pending':''}">${a.status}</span><p><b>Patient:</b> ${esc(a.patient)} &nbsp; <b>Doctor:</b> ${esc(a.doctor)}</p><p><b>Date/time:</b> ${esc(a.date)} at ${esc(a.time)}</p><p><b>Reason:</b> ${esc(a.reason)}</p>${a.response?`<p><b>Doctor response:</b> ${esc(a.response)}</p>`:''}${doctorActions}</div>`}
function book(e){e.preventDefault();let date=document.getElementById('adate').value,time=document.getElementById('atime').value,reason=document.getElementById('areason').value.trim();if(!reason){alert('Please enter appointment reason.');return}let ap=read('cc_appointments',[]);if(ap.some(a=>a.patient===current.name&&a.date===date&&a.time===time&&a.status!=='Cancelled')){alert('You already have an appointment request at this time.');return}ap.push({id:'APT'+(1001+ap.length),patient:current.name,doctor:USERS.doctor.name,date,time,reason,status:'Requested',response:''});save('cc_appointments',ap);alert('Appointment request submitted!');render()}
function status(id,s){let ap=read('cc_appointments',[]);ap=ap.map(a=>a.id===id?{...a,status:s}:a);save('cc_appointments',ap);render()}
function reportsPage(){let rp=read('cc_reports',[]),visible=current.role==='patient'?rp.filter(r=>r.patient===current.name):rp;let upload=current.role==='patient'?`<div class="card"><h3>Upload a sample medical report</h3><form onsubmit="uploadReport(event)"><div class="field"><label>Report title</label><input id="rtitle" required placeholder="e.g. Blood test report"></div><div class="field"><label>Select file (PDF or image, max 1 MB)</label><input class="report-file" id="rfile" type="file" accept=".pdf,.png,.jpg,.jpeg" required></div><button>Upload report</button></form></div>`:'';return upload+`<div class="card"><h2>${current.role==='patient'?'My Reports':'Patient Reports'}</h2>${visible.length?visible.map(r=>`<div class="item"><b>${esc(r.title)}</b><p class="muted">Patient: ${esc(r.patient)} • ${esc(r.date)}</p><p>${esc(r.filename)}</p>${r.data?`<button class="secondary" onclick="viewReport('${r.id}')">View / Download</button>`:'<span class="muted">File unavailable in this demo</span>'}</div>`).join(''):'<p class="muted">No reports uploaded.</p>'}</div>`}
function uploadReport(e){e.preventDefault();let file=document.getElementById('rfile').files[0],title=document.getElementById('rtitle').value.trim();if(!file)return;if(file.size>1024*1024){alert('File is too large. Please select a file under 1 MB.');return}let reader=new FileReader();reader.onload=()=>{let rp=read('cc_reports',[]);rp.push({id:'REP'+Date.now(),patient:current.name,title,filename:file.name,date:new Date().toLocaleDateString(),data:reader.result});try{save('cc_reports',rp);alert('Report uploaded successfully!');render()}catch{alert('Storage is full. Try a smaller file.')}};reader.readAsDataURL(file)}
function viewReport(id){let r=read('cc_reports',[]).find(x=>x.id===id);if(!r)return;let w=window.open();if(!w){alert('Please allow pop-ups to view the report.');return}w.document.write(`<title>${esc(r.title)}</title><h3>${esc(r.title)} — ${esc(r.patient)}</h3><p>Demo report viewer. Download/print from your browser.</p><iframe src="${r.data}" style="width:100%;height:85vh;border:0"></iframe>`)}
function messagesPage(){let msgs=read('cc_messages',[]);let visible=current.role==='patient'?msgs.filter(m=>m.patient===current.name):msgs;return `<div class="card"><h2>Patient–Doctor Messages</h2><p class="muted">This is a simulated communication module.</p>${visible.map(m=>`<div class="item"><b>${m.from==='doctor'?'Doctor':'Patient'} • ${esc(m.time)}</b><p>${esc(m.text)}</p></div>`).join('')}<form onsubmit="sendMessage(event)"><div class="field"><label>${current.role==='patient'?'Message to doctor':'Response to patient'}</label><textarea id="msgtext" maxlength="500" required placeholder="Type message..."></textarea></div><button>Send message</button></form></div>`}
function sendMessage(e){e.preventDefault();let text=document.getElementById('msgtext').value.trim();if(!text)return;let msgs=read('cc_messages',[]);msgs.push({id:Date.now(),patient:USERS.patient.name,doctor:USERS.doctor.name,from:current.role,text,time:new Date().toLocaleString()});save('cc_messages',msgs);alert('Message sent in demo portal.');render()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
</script>
</body>
</html>
