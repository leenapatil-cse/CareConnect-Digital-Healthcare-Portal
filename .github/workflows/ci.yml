
name: Healthcare Portal CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          test -f index.html
          test -f README.md
          test -f Dockerfile

      - name: Check HTML structure
        run: |
          grep -qi "<html" index.html
          grep -qi "</html>" index.html

      - name: Build Docker image
        run: docker build -t healthcare-portal .

