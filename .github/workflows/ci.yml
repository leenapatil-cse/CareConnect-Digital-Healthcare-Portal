
name: Healthcare Portal CI

on:
  push:
    branches: [main, feature/healthcare-portal-ui]
  pull_request:
    branches: [main]

jobs:
  healthcare-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          test -f index.html
          test -f README.md
          echo "Project files verified"

      - name: Basic HTML check
        run: |
          grep -qi "&lt;html" index.html
          grep -qi "&lt;/html" index.html
          echo "HTML structure check passed"
